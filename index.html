  <title>Лезги Мавлид</title>
  <script>
    (function () {
      try {
        var isDark = localStorage.getItem('mavlid_lezgi_theme') === 'dark';
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', isDark ? '#0f172a' : '#ffffff');
        var metaApple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (metaApple) metaApple.setAttribute('content', isDark ? 'black-translucent' : 'default');
      } catch (e) { }
    })();
  </script>
